name: Changesets

# The release train (D77), on every push to main, with changesets/action:
#
#   - Pending changesets (.changeset/*.md)? → opens or updates the "Version packages" pull
#     request: `pnpm changeset:version` bumps the five packages together (fixed group), writes
#     their CHANGELOG.md, copies the version into RUNTIME_VERSION and the reference snapshot.
#   - None (the Version packages pull request was just merged)? → scripts/release-version.mjs
#     tags the committed version vX.Y.Z when it is not tagged yet and runs release.yml on the tag
#     (GitHub release with the .vsix, Marketplace, Open VSX, npm).
#
# So the only human step of a release is merging the Version packages pull request.
#
# ── Optional: a GitHub App ───────────────────────────────────────────────────────────────────
# A pull request opened with the GITHUB_TOKEN of a workflow runs no other workflow (GitHub
# prevents loops): the CI does not run on the Version packages pull request. It runs on main
# once merged, and the Release workflow builds and checks everything again. To have the CI on
# the pull request too, give the workflow its own identity, a GitHub App (never expires):
#   1. Settings → Developer settings → GitHub Apps → New: permissions Contents RW and Pull
#      requests RW, no webhook; install it on this repository.
#   2. Repository variable RELEASE_APP_ID (the App ID) and secret RELEASE_APP_PRIVATE_KEY (a
#      private key .pem of the App).
# The release itself does not need it: the tag is created and release.yml started with the
# GITHUB_TOKEN (a workflow_dispatch does start the other workflow).

on:
  push:
    branches: [main]

concurrency: changesets-main

permissions:
  contents: write # the version branch, the tag
  pull-requests: write # the Version packages pull request
  actions: write # starts release.yml

jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub App token (optional)
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          # the pull request: the App when there is one (v2 takes the token as an input)
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version-script: pnpm changeset:version
          publish-script: node scripts/release-version.mjs
          commit-message: "Version packages"
          pr-title: "Version packages"
          # the tags and the GitHub releases are made by release-version.mjs and release.yml
          create-github-releases: false
          push-git-tags: false
        env:
          # release-version.mjs: always the GITHUB_TOKEN (its tag must not start release.yml a
          # second time; its workflow_dispatch does start it)
          GH_TOKEN: ${{ github.token }}
