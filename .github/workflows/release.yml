name: Release

# A tag v1.2.3 publishes the VS Code extension: the .vsix is attached to the GitHub release of
# the tag, and published to the Visual Studio Marketplace and Open VSX when their tokens are set
# (repository secrets VSCE_PAT and OVSX_PAT). With the secret NPM_TOKEN, it also publishes the npm
# packages (D65): rap-transpiler (the rapt command) and @rap-transpiler/model, compiler, runtime.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vscode:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version of the extension from the tag
        working-directory: packages/vscode
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Package the extension (.vsix)
        run: pnpm --filter rap-transpiler-vscode run package
      - name: Embedded rapt works
        run: node packages/vscode/rapt/node_modules/@rap-transpiler/compiler/dist/cli.js check fixtures/travel --warnings-as-errors
      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packages/vscode/rap-transpiler-vscode.vsix "rap-transpiler-vscode-${GITHUB_REF_NAME#v}.vsix"
          gh release create "$GITHUB_REF_NAME" "rap-transpiler-vscode-${GITHUB_REF_NAME#v}.vsix" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "rap-transpiler-vscode-${GITHUB_REF_NAME#v}.vsix" --clobber
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath rap-transpiler-vscode.vsix --pat "$VSCE_PAT"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: npx --yes ovsx@0.10 publish rap-transpiler-vscode.vsix --pat "$OVSX_PAT"

  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Versions of the packages from the tag
        if: env.NPM_TOKEN != ''
        run: |
          for p in model compiler runtime cli; do (cd "packages/$p" && npm pkg set version="${GITHUB_REF_NAME#v}"); done
      - run: pnpm install --frozen-lockfile
        if: env.NPM_TOKEN != ''
      - run: pnpm build
        if: env.NPM_TOKEN != ''
      - name: rapt of the package works
        if: env.NPM_TOKEN != ''
        run: node packages/cli/bin/rapt.mjs check fixtures/travel --warnings-as-errors
      - name: Publish (workspace:* becomes the version of the tag)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r --filter @rap-transpiler/model --filter @rap-transpiler/runtime --filter @rap-transpiler/compiler --filter rap-transpiler publish --access public --no-git-checks
