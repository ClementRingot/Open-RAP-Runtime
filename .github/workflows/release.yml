name: Release

# A tag v1.2.3 publishes the VS Code extension: the .vsix is attached to the GitHub release of
# the tag, and published to the Visual Studio Marketplace and Open VSX when their tokens are set
# (repository secrets VSCE_PAT and OVSX_PAT). It also publishes the rapt command line to npm
# (open-rap-runtime and @open-rap/model, compiler, runtime, D65) when NPM_TOKEN is set.
# It also runs by hand (Actions → Release → Run workflow, or the API) with a version: the release
# then creates the tag v<version> on the commit of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string

env:
  # the tag of the release: the pushed tag, or v<version> of a run by hand
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  vscode:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version of the extension from the tag
        working-directory: packages/vscode
        run: npm pkg set version="${RELEASE_TAG#v}"
      - name: Package the extension (.vsix)
        run: pnpm --filter open-rap-runtime-vscode run package
      - name: Embedded rapt works
        run: node packages/vscode/rapt/node_modules/@open-rap/compiler/dist/cli.js check fixtures/travel --warnings-as-errors
      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packages/vscode/open-rap-runtime-vscode.vsix "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix"
          gh release create "$RELEASE_TAG" "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix" --title "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes \
            || gh release upload "$RELEASE_TAG" "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix" --clobber
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath open-rap-runtime-vscode.vsix --pat "$VSCE_PAT"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: npx --yes ovsx@0.10 publish open-rap-runtime-vscode.vsix --pat "$OVSX_PAT"

  npm:
    # rapt on npm (D65): npm install -g open-rap-runtime. Skipped when the NPM_TOKEN secret is not set;
    # the @open-rap organization must exist on npmjs.com.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version of the packages from the tag
        run: |
          for p in model compiler runtime cli; do
            (cd "packages/$p" && npm pkg set version="${RELEASE_TAG#v}")
          done
      - run: pnpm build
      # the packages as published, installed by npm: rapt of open-rap-runtime checks the fixture
      - name: Packed packages work
        run: |
          V="${RELEASE_TAG#v}"
          P="$RUNNER_TEMP/packs"
          mkdir -p "$P" "$RUNNER_TEMP/check"
          # one folder per package: pnpm pack names the archives after the package names
          for p in model compiler runtime cli; do
            mkdir -p "$P/$p"
            (cd "packages/$p" && pnpm pack --pack-destination "$P/$p")
          done
          cd "$RUNNER_TEMP/check"
          cat > package.json <<JSON
          {
            "private": true,
            "dependencies": { "open-rap-runtime": "file:$P/cli/open-rap-runtime-$V.tgz" },
            "overrides": {
              "@open-rap/model": "file:$P/model/open-rap-model-$V.tgz",
              "@open-rap/compiler": "file:$P/compiler/open-rap-compiler-$V.tgz",
              "@open-rap/runtime": "file:$P/runtime/open-rap-runtime-$V.tgz"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx --no-install rapt --help | head -n 1 | grep -F "rapt $V:"
          npx --no-install rapt check "$GITHUB_WORKSPACE/fixtures/travel" --warnings-as-errors
          npx --no-install rapt build "$GITHUB_WORKSPACE/fixtures/travel" --out "$RUNNER_TEMP/travel"
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        env:
          # provenance (the package linked to this workflow run) needs a public repository
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks

  site:
    # the website serves the .vsix of this release (site.yml takes the latest release)
    needs: vscode
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
