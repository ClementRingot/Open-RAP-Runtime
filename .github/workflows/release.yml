name: Release
# the name the Changesets workflow looks for, so that a version is never released twice (D77)
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Publishes a version: the VS Code extension (the .vsix attached to the GitHub release of the
# tag, the Visual Studio Marketplace and Open VSX) and the rapt command line on npm
# (open-rap-runtime and @open-rap/model, compiler, runtime, D65).
#
# No token is stored (D78): every registry trusts this workflow by trusted publishing (OIDC). The
# job asks GitHub for an identity token (id-token: write) that the registry exchanges for a
# short-lived credential, provided this repository and this workflow file are declared as its
# trusted publisher:
#   - npm: each package → Settings → Trusted Publisher → GitHub Actions
#     (ClementRingot / Open-RAP-Runtime / release.yml); provenance is attested automatically.
#   - Visual Studio Marketplace: a Trusted Publishing policy of the publisher abaper for
#     this workflow; published when the repository variable PUBLISH_VS_MARKETPLACE is true.
#   - Open VSX: the trusted publisher of the namespace abaper; published when the
#     repository variable PUBLISH_OPEN_VSX is true.
#
# Normally started by the Changesets workflow once the "Version packages" pull request is merged
# (D77): it tags the version and runs this workflow on the tag. It also runs on a tag v1.2.3
# pushed by hand, or by hand (Actions → Release → Run workflow) with a version. In every case the
# version is the one committed in the packages (scripts/check-version-sync.mjs --tag): the
# versions are changed by Changesets, never at release time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string

env:
  # the tag of the release: the pushed tag, or v<version> of a run by hand
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to the Marketplace and Open VSX (D78)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is the committed version
        run: node scripts/check-version-sync.mjs --tag "$RELEASE_TAG"
      - run: pnpm build
      - name: Package the extension (.vsix)
        run: pnpm --filter open-rap-runtime-vscode run package
      - name: Embedded rapt works
        run: node packages/vscode/rapt/node_modules/@open-rap/compiler/dist/cli.js check fixtures/travel --warnings-as-errors
      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packages/vscode/open-rap-runtime-vscode.vsix "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix"
          # the notes: the changelogs of the version (Changesets), else generated by GitHub
          node scripts/release-notes.mjs "${RELEASE_TAG#v}" > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then NOTES=(--notes-file "$RUNNER_TEMP/notes.md"); else NOTES=(--generate-notes); fi
          gh release create "$RELEASE_TAG" "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix" --title "$RELEASE_TAG" --target "$GITHUB_SHA" "${NOTES[@]}" \
            || gh release upload "$RELEASE_TAG" "open-rap-runtime-vscode-${RELEASE_TAG#v}.vsix" --clobber
      # trusted publishing (D78): no token; --skip-duplicate, a version already published passes
      - name: Visual Studio Marketplace
        if: vars.PUBLISH_VS_MARKETPLACE == 'true'
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath open-rap-runtime-vscode.vsix --oidc --skip-duplicate
      - name: Open VSX
        if: vars.PUBLISH_OPEN_VSX == 'true'
        working-directory: packages/vscode
        run: npx --yes ovsx@1.3.0 publish --packagePath open-rap-runtime-vscode.vsix --trusted-publishing --skip-duplicate

  npm:
    # rapt on npm (D65): npm install -g open-rap-runtime. Trusted publishing (D78): no npm token;
    # each of the four packages lists this repository and release.yml as its trusted publisher.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # no registry-url: it would write an .npmrc waiting for a token, OIDC needs none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # trusted publishing needs npm 11.5.1 or later; Node.js 22 comes with npm 10
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - name: The tag is the committed version
        run: node scripts/check-version-sync.mjs --tag "$RELEASE_TAG"
      - run: pnpm build
      # the packages as published, installed by npm: rapt of open-rap-runtime checks the fixture
      - name: Packed packages work
        run: |
          V="${RELEASE_TAG#v}"
          P="$RUNNER_TEMP/packs"
          mkdir -p "$P" "$RUNNER_TEMP/check"
          # one folder per package: pnpm pack names the archives after the package names
          for p in model compiler runtime cli; do
            mkdir -p "$P/$p"
            (cd "packages/$p" && pnpm pack --pack-destination "$P/$p")
          done
          cd "$RUNNER_TEMP/check"
          cat > package.json <<JSON
          {
            "private": true,
            "dependencies": { "open-rap-runtime": "file:$P/cli/open-rap-runtime-$V.tgz" },
            "overrides": {
              "@open-rap/model": "file:$P/model/open-rap-model-$V.tgz",
              "@open-rap/compiler": "file:$P/compiler/open-rap-compiler-$V.tgz",
              "@open-rap/runtime": "file:$P/runtime/open-rap-runtime-$V.tgz"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx --no-install rapt --help | head -n 1 | grep -F "rapt $V:"
          npx --no-install rapt check "$GITHUB_WORKSPACE/fixtures/travel" --warnings-as-errors
          npx --no-install rapt build "$GITHUB_WORKSPACE/fixtures/travel" --out "$RUNNER_TEMP/travel"
      # the archives checked above (pnpm pack wrote the versions of workspace:*), published by npm:
      # it exchanges the identity token of the job, pnpm does not; a version already on npm passes
      - name: Publish to npm
        run: |
          for p in model compiler runtime cli; do
            NAME="$(node -p "require('./packages/$p/package.json').name")"
            VERSION="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is on npm already"
            else
              npm publish "$RUNNER_TEMP"/packs/$p/*.tgz --access public
            fi
          done

  site:
    # the website serves the .vsix of this release (site.yml takes the latest release)
    needs: vscode
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
