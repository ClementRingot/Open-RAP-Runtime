name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # end-to-end test of the generated application (packages/runtime/test/e2e.test.ts)
      RAPT_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # the merge base of a pull request, for the changeset check
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # one version in every file that carries it (D77)
      - run: pnpm check:version
      - name: A changeset when released content changes (D77)
        if: github.event_name == 'pull_request'
        run: node scripts/require-changeset.mjs "origin/${{ github.base_ref }}"
      - run: pnpm typecheck
      - run: pnpm build
      - name: Chromium for the UI tests
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: pnpm test
      - name: Check the reference fixture
        run: node packages/compiler/dist/cli.js check fixtures/travel --warnings-as-errors
      - name: abapGit files of the fixture complete
        run: node packages/compiler/dist/cli.js abapgit fixtures/travel --check
      # the VS Code extension with rapt, OpenUI5 and PGlite inside (D39), on the Node.js it embeds
      - name: VS Code extension (.vsix)
        run: pnpm --filter open-rap-runtime-vscode run package
      - name: Embedded rapt
        run: node packages/vscode/rapt/node_modules/@open-rap/compiler/dist/cli.js check fixtures/travel --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: open-rap-runtime-vscode
          path: packages/vscode/open-rap-runtime-vscode.vsix
          if-no-files-found: error

  docker:
    # the generated application as delivered: image, docker compose, OData service
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node packages/compiler/dist/cli.js build fixtures/travel --out out/travel
      - name: docker compose up
        working-directory: out/travel
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Service checks
        run: |
          S=http://localhost:8080/sap/opu/odata4/sap/zrt_ui_travel_o4/srvd/sap/zrt_ui_travel/0001
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST "$S/Travel" -H "content-type: application/json" \
            -d '{"TravelID":"00000001","AgencyID":"070001","CustomerID":"000001","BeginDate":"2027-05-01","EndDate":"2027-05-08","BookingFee":"40.00","CurrencyCode":"EUR"}'
          curl -fsS "$S/Travel?\$count=true" | grep -q '"@odata.count":1'
          curl -fsS -o /dev/null http://localhost:8080/ui/index.html
      - name: docker compose down
        if: always()
        working-directory: out/travel
        run: docker compose down -v
      # the same application with AUTH_MODE=oidc and the Keycloak of its compose profile
      - name: docker compose up with Keycloak
        working-directory: out/travel
        env:
          AUTH_MODE: oidc
        run: |
          docker compose --profile oidc up -d --build --wait --wait-timeout 180
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:8180/realms/rapt/.well-known/openid-configuration && break
            sleep 2
          done
      - name: OIDC with Keycloak
        env:
          RAPT_E2E_OIDC_APP: http://localhost:8080
          RAPT_E2E_OIDC_KEYCLOAK: http://localhost:8180
        run: pnpm vitest run packages/runtime/test/keycloak.test.ts
      - name: docker compose down (oidc)
        if: always()
        working-directory: out/travel
        run: AUTH_MODE=oidc docker compose --profile oidc down -v
      # the launchpad (D37) with the application behind it: one origin, the service at its path
      - name: rapt launchpad
        run: |
          cat > out/launchpad.json <<'JSON'
          {
            "title": "Travel Agency",
            "apps": [{ "id": "travel", "build": "travel", "url": "http://localhost:8080/" }],
            "groups": [{ "title": "Travels", "tiles": [{ "title": "Manage Travels", "app": "travel", "intent": "Travel-manage", "count": "Travel" }] }]
          }
          JSON
          node packages/compiler/dist/cli.js launchpad out/launchpad.json --out out/launchpad --warnings-as-errors
      - name: docker compose up (launchpad)
        working-directory: out/launchpad
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Launchpad checks
        run: |
          L=http://localhost:8090
          S=$L/sap/opu/odata4/sap/zrt_ui_travel_o4/srvd/sap/zrt_ui_travel/0001
          curl -fsS $L/health
          curl -fsS $L/launchpad/config | grep -q '"Manage Travels"'
          curl -fsS -X POST "$S/Travel" -H "content-type: application/json" \
            -d '{"TravelID":"00000001","AgencyID":"070001","CustomerID":"000001","BeginDate":"2027-05-01","EndDate":"2027-05-08","BookingFee":"40.00","CurrencyCode":"EUR"}'
          test "$(curl -fsS "$S/Travel/\$count")" = "1"
          curl -fsS -o /dev/null $L/ui/index.html
          curl -fsS $L/apps/travel/ui/index.html | grep -q 'data-name="rapt.app"'
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' $L/go/Travel-manage)" = "$L/apps/travel/ui/index.html"
      - name: docker compose down (launchpad)
        if: always()
        working-directory: out/launchpad
        run: docker compose down -v
